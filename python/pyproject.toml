[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "tlmbench"
version = "0.1.0"
description = "TelemetryBench: read telemetry recordings, query them as the app does, check, convert and export to HTML"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
arrow = ["pyarrow>=20"]

[tool.maturin]
module-name = "tlmbench._core"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
