[package]
name = "tlmbench-python"
description = "TelemetryBench for Python: the same core as the app and the command line, as the `tlmbench` package"
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
tlmbench-core = { path = "../crates/core" }
tlmbench-decode = { path = "../crates/decode" }
tlmbench-store = { path = "../crates/store" }
tlmbench-expr = { path = "../crates/expr" }
tlmbench-export = { path = "../crates/export" }
serde_json = "1.0.154"
# the Arrow C stream interface: a recording hands its columns to pyarrow, polars, DuckDB... without a copy through Python
arrow-array = { version = "60.1.0", features = ["ffi"] }
arrow-schema = "60.1.0"

# Its own workspace and target folder, like the plugin crates: an extension module links only through maturin.
[workspace]

# opt-level 2, not 0: at 0 rustc shares generic instances across crates, and on Windows the extension then fails to
# link (LNK2019 on instances the upstream crates didn't emit). Debug builds are what `maturin develop` makes.
[profile.dev]
opt-level = 2
# line tables only: full debug info at opt-level 2 ran the Linux CI runner out of memory (rustc killed, Nov 25-26)
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
