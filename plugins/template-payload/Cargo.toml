[package]
name = "my-payload"
version = "0.1.0"
edition = "2024"
publish = false

# A payload plugin for TelemetryBench: decodes packet payloads or fields a descriptor names it for.
# Build:  cargo build --release --target wasm32-wasip2
# Install: copy target/wasm32-wasip2/release/my_payload.wasm to the plugins folder (Settings › Plugins opens it).

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57.1"

[profile.release]
opt-level = 3
lto = true
strip = true

# (not part of tlmbench's workspace)
[workspace]
