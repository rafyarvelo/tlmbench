[workspace]
resolver = "3"
members = ["crates/core", "crates/decode", "crates/store", "crates/live", "crates/export", "cli", "tools/gen", "app/src-tauri"]
exclude = ["crates/decode/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tlmbench-core = { path = "crates/core" }
tlmbench-decode = { path = "crates/decode" }
tlmbench-store = { path = "crates/store" }
tlmbench-live = { path = "crates/live" }
tlmbench-export = { path = "crates/export" }
rayon = "1.12.0"
rtrb = "0.4.1"
serialport = { version = "4.10.1", default-features = false }
socket2 = "0.6.5"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
bytemuck = "1.25.2"
csv-core = "0.1.13"
dirs = "7.0.0"
lexical-core = "1.0.6"
memchr = "2.8.3"
memmap2 = "0.9.12"
toml = "1.1.8"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-zlib-rs", "brotli"] }
arrow-array = "60.1.0"
zstd = "0.14.3"
lz4_flex = "0.14.0"
flate2 = "1.1.10"
crc32fast = "1.5.4"
arrow-schema = "60.1.0"
arrow-ipc = "60.1.0"
ndarray = "0.17.2"
hdf5 = { package = "hdf5-metno", version = "0.15.1", features = ["static", "zlib"] }
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables only, and none for dependencies: backtraces still name files and lines, and a debug build of the
# workspace (arrow and parquet included) stays a few GB instead of about 15.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
