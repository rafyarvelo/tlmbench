[workspace]
resolver = "3"
members = ["crates/core", "crates/decode", "crates/store", "crates/live", "cli", "tools/gen", "app/src-tauri"]
exclude = ["crates/decode/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tlmbench-core = { path = "crates/core" }
tlmbench-decode = { path = "crates/decode" }
tlmbench-store = { path = "crates/store" }
tlmbench-live = { path = "crates/live" }
rayon = "1.12.0"
rtrb = "0.4.1"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
bytemuck = "1.25.2"
csv-core = "0.1.13"
dirs = "7.0.0"
lexical-core = "1.0.6"
memchr = "2.8.3"
memmap2 = "0.9.12"
toml = "1.1.8"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
