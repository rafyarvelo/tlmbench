[package]
name = "tlmbench-app"
description = "TelemetryBench desktop app: the Tauri shell around the core, with the web UI in ../ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tlmbench-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tlmbench-core.workspace = true
tlmbench-store.workspace = true
tlmbench-decode.workspace = true
tlmbench-export.workspace = true
tlmbench-expr.workspace = true
tlmbench-live.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["test"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
getrandom = "0.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
