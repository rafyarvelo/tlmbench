[package]
name = "tlmbench-app"
description = "TelemetryBench desktop app: the Tauri shell around the core, with the web UI in ../ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tlmbench-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tlmbench-core.workspace = true
tlmbench-store.workspace = true
tlmbench-decode.workspace = true
tlmbench-export.workspace = true
tlmbench-expr.workspace = true
tlmbench-live.workspace = true
tlmbench-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
# the Connect dialog's one-second read goes to a temporary recording
tempfile.workspace = true
tauri = { version = "2.12.5", features = ["test"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
getrandom = "0.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
# Explorer watches its folder for new and removed files (design UI, D-ui-02)
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }

# Windows and Linux: a second launch hands its files to the running app (file associations, R4)
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

# Windows: Install command-line tool… puts the app's folder on the user's PATH
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
