[package]
name = "tlmbench-web"
description = "TelemetryBench in a browser: the core compiled to WASM, answering the viewer's queries over an export's data (and, in browser-only mode, over files opened in the page)"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tlmbench-core = { path = "../core" }
tlmbench-expr = { path = "../expr" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
blake3 = "1.8.7"
csv-core = "0.1.13"
lexical-core = "1.0.6"
memchr = "2.8.3"
bytemuck = "1.25.2"
toml = "1.1.8"
# packet payloads (packets_core.rs): pure Rust only, since the WASM build has no C compiler. zstd is the shim (below).
crc32fast = "1.5.4"
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zstd = "0.14"

[dev-dependencies]
# the decoder's CSV reader is included as source, with its tests
proptest = "1.12.0"
tempfile = "3.27.0"

# Its own workspace and target folder: the WASM build must not share the native one.
[workspace]

# the zstd crate binds to C: the browser's build reads Zstandard through ruzstd instead (decode only)
[patch.crates-io]
zstd = { path = "../web-parquet/zstd-shim" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
